document.addEventListener('DOMContentLoaded', function () {
class Component {
  componentDidMount() {
    const wnavBurger = document.getElementById('wnav-burger');
    const wnavMenu = document.getElementById('wnav-mobile-menu');
    if (wnavBurger && wnavMenu) {

    const patternSrc = document.getElementById('tile-pattern');

    const PW = 2182, PH = 5671;
    const GS = window.innerWidth <= 760 ? 0.42 : 1;

    canvas.style.height = (PH * NY) + 'px';

    const offsets = []; for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) offsets.push([i * PW, j * PH]);
    const sourceTiles = [...patternSrc.children];
    const lbItems = sourceTiles.map(t => { const v = t.querySelector('video'), im = t.querySelector('img'); return v ? { type: 'v', src: v.getAttribute('data-full') || v.getAttribute('src') } : { type: 'i', src: im ? (im.getAttribute('data-full') || im.getAttribute('src')) : '', alt: im ? im.alt : '' }; });
    offsets.forEach(([ox, oy]) => {
      sourceTiles.forEach((tile, ti) => {
        const clone = tile.cloneNode(true);
        clone.setAttribute('data-idx', ti);
        const baseLeft = parseFloat(tile.getAttribute('data-x'));
        const baseTop  = parseFloat(tile.getAttribute('data-y'));

        clone.style.top  = (baseTop + oy) + 'px';

    const lightbox = document.createElement('div');
    lightbox.style.cssText = 'position:fixed;inset:0;z-index:500;background:rgba(11,11,11,0.94);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 260ms ease;';
    const lbImg = document.createElement('img');

    lightbox.appendChild(lbImg);
    document.body.appendChild(lightbox);
    const lbClose = document.createElement('button'); lbClose.id = 'lb-close'; lbClose.type = 'button'; lbClose.setAttribute('aria-label', 'Close');

    lbClose.style.cssText = 'position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:510;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,0.35);background:rgba(11,11,11,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;';

    // browse with arrows, keys and swipe
    let lbIdx = -1;
    const showItem = (i) => {
      const nItems = lbItems.length; if (!nItems) return;
      lbIdx = ((i % nItems) + nItems) % nItems; const it = lbItems[lbIdx];
      if (it.type === 'v') { openVideo(it.src); }
      else { lbVid.pause(); lbVid.removeAttribute('src'); lbVid.load(); lbVid.style.display = 'none'; openLightbox(it.src, it.alt); }
    };
    const mob = window.innerWidth <= 760;
    const mkArrow = (dir) => {

      b.innerHTML = dir < 0 ? '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10L12.5 16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7.5 4L13.5 10L7.5 16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const pos = mob ? ('bottom:calc(20px + env(safe-area-inset-bottom));' + (dir < 0 ? 'left:calc(50% - 64px);' : 'left:calc(50% + 12px);')) : ('top:50%;margin-top:-26px;' + (dir < 0 ? 'left:20px;' : 'right:20px;'));
      b.style.cssText = 'position:fixed;' + pos + 'z-index:510;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,0.35);background:rgba(11,11,11,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;';
      b.addEventListener('click', (e) => { e.stopPropagation(); showItem(lbIdx + dir); });
      lightbox.appendChild(b);
    };

    const lbOpen = () => lightbox.style.opacity === '1';
    window.addEventListener('keydown', (e) => { if (!lbOpen()) return; if (e.key === 'ArrowLeft') showItem(lbIdx - 1); if (e.key === 'ArrowRight') showItem(lbIdx + 1); });

    lightbox.addEventListener('touchend', (e) => { if (swX === null) return; const t = e.changedTouches[0]; const dx = t.clientX - swX, dy = t.clientY - swY; swX = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) showItem(lbIdx + (dx < 0 ? 1 : -1)); }, { passive: true });
    /*vlb*/ const lbVid=document.createElement('video');lbVid.controls=true;lbVid.playsInline=true;lbVid.style.cssText='max-width:96vw;max-height:calc(100vh - 140px);width:auto;height:auto;border-radius:14px;box-shadow:0 50px 120px rgba(0,0,0,0.6);display:none;background:#000;';lightbox.appendChild(lbVid);lbVid.addEventListener('click',e=>e.stopPropagation());
    const openVideo=(src)=>{lbToken++;lbImg.style.display='none';lbVid.style.display='block';lightbox.style.opacity='1';lightbox.style.pointerEvents='auto';lbVid.src=src;lbVid.muted=false;lbVid.play().catch(()=>{lbVid.muted=true;lbVid.play().catch(()=>{})});};

    let lbToken = 0;
    const openLightbox = (src, alt) => {
      lbImg.style.display = '';
      const token = ++lbToken;
      lbImg.style.opacity = '0';
      lbImg.removeAttribute('src');
      lightbox.style.opacity = '1';
      lightbox.style.pointerEvents = 'auto';
      const show = () => { if (token === lbToken) lbImg.style.opacity = '1'; };
      lbImg.onload = show;
      lbImg.alt = alt || '';
      lbImg.src = src;
      if (lbImg.complete && lbImg.currentSrc) show();
    };
    const closeLightbox = () => {
      lbVid.pause();lbVid.removeAttribute('src');lbVid.load();lbVid.style.display='none';lbImg.style.display='';

      lightbox.style.opacity = '0';
      lightbox.style.pointerEvents = 'none';
      lbImg.style.opacity = '0';
      lbImg.removeAttribute('src');
    };

    const onKey = (e) => { if (e.key === 'Escape') closeLightbox(); };

    let viewX = PW * 0.2, viewY = PH * 0.75;
    let dragging = false;
    let lastPX = 0, lastPY = 0;
    let dragDistance = 0;
    let idleTimer = null;
    let autoplay = true;
    const SPEED_X = 26, SPEED_Y = 20;
    let mouseNX = 0, mouseNY = 0;
    let parX = 0, parY = 0;
    const PARALLAX_RANGE = 22;

    const wrap = (v, m) => ((v % m) + m) % m;
    const render = () => {
      canvas.style.transformOrigin = '0 0'; canvas.style.transform = `translate3d(${(-viewX * GS + parX).toFixed(1)}px, ${(-viewY * GS + parY).toFixed(1)}px, 0) scale(${GS})`;
    };

    let raf = null;
    let last = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (autoplay && !dragging) {
        viewX = wrap(viewX - SPEED_X * dt / GS, PW);
        viewY = wrap(viewY + SPEED_Y * dt / GS, PH);
      }
      const targetParX = mouseNX * PARALLAX_RANGE;
      const targetParY = mouseNY * PARALLAX_RANGE;
      parX += (targetParX - parX) * 0.05;
      parY += (targetParY - parY) * 0.05;
      render();
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    const onHoverMove = (e) => {
      const r = stage.getBoundingClientRect();
      mouseNX = ((e.clientX - r.left) / r.width) - 0.5;
      mouseNY = ((e.clientY - r.top) / r.height) - 0.5;
    };
    stage.addEventListener('mousemove', onHoverMove, { passive: true });
    stage.addEventListener('mouseleave', () => { mouseNX = 0; mouseNY = 0; }, { passive: true });

    const wakeAutoplay = () => {
      clearTimeout(idleTimer);
      autoplay = false;
      idleTimer = setTimeout(() => { autoplay = true; }, 400);
    };

    const onDown = (e) => {
      dragging = true;
      autoplay = false;
      dragDistance = 0;
      clearTimeout(idleTimer);
      stage.style.cursor = 'grabbing';
      const p = e.touches ? e.touches[0] : e;
      lastPX = p.clientX; lastPY = p.clientY;
      if (hint) hint.style.opacity = '0';
    };
    const onMove = (e) => {
      if (!dragging) return;
      const p = e.touches ? e.touches[0] : e;
      const dx = p.clientX - lastPX, dy = p.clientY - lastPY;
      lastPX = p.clientX; lastPY = p.clientY;
      dragDistance += Math.hypot(dx, dy);
      viewX = wrap(viewX - dx / GS, PW);
      viewY = wrap(viewY - dy / GS, PH);
    };
    const onUp = (e) => {
      if (!dragging) return;
      dragging = false;
      stage.style.cursor = 'grab';
      wakeAutoplay();
      if (dragDistance < 6) {
        const tile = e.target && e.target.closest ? e.target.closest('[data-photo]') : null;
        if (tile) {
          const ix = parseInt(tile.getAttribute('data-idx'), 10);
          if (!isNaN(ix)) { showItem(ix); return; }
          const vEl = tile.querySelector('video');
          if (vEl) { openVideo(vEl.getAttribute('data-full') || vEl.currentSrc || vEl.src); return; }
          const img = tile.querySelector('img');
          if (img) {
            const full = img.getAttribute('data-full');
            openLightbox(full || img.currentSrc || img.src, img.alt);
          }
        }
      }
    };

    stage.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, { passive: true });
    window.addEventListener('pointerup', onUp, { passive: true });

    const onWheel = (e) => {
      e.preventDefault();
      autoplay = false;
      clearTimeout(idleTimer);
      viewX = wrap(viewX + e.deltaX * 0.5 / GS, PW);
      viewY = wrap(viewY + e.deltaY * 0.5 / GS, PH);
      wakeAutoplay();
    };
    stage.addEventListener('wheel', onWheel, { passive: false });

    this._cleanup = () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('keydown', onKey);
      stage.removeEventListener('wheel', onWheel);
      lightbox.remove();
    };
  }

  componentWillUnmount() {
    if (this._cleanup) this._cleanup();
  }
}
const __component = new Component();
__component.componentDidMount();
});
</script>
