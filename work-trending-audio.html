<script>
document.addEventListener('DOMContentLoaded', function () {
class Component {
  componentDidMount() {
    const wnavBurger = document.getElementById('wnav-burger');
    const wnavMenu = document.getElementById('wnav-mobile-menu');
    if (wnavBurger && wnavMenu) {
      wnavBurger.addEventListener('click', () => { wnavMenu.style.display = 'flex'; });
      wnavMenu.querySelectorAll('a, button').forEach(el => el.addEventListener('click', () => { wnavMenu.style.display = 'none'; }));
    }

    const stage      = document.getElementById('gallery-stage');
    const canvas     = document.getElementById('gallery-canvas');
    const hint       = document.getElementById('drag-hint');
    const patternSrc = document.getElementById('tile-pattern');
    if (!stage || !canvas || !patternSrc) return;

    let PW = 1, PH = 1;
    const GS = 1;
    let NX = 1, NY = 1;

    const sourceTiles = [...patternSrc.children];
    const lbItems = sourceTiles.map(t => { const v = t.querySelector('video'), im = t.querySelector('img'); return v ? { type: 'v', src: v.getAttribute('data-full') || v.getAttribute('src') } : { type: 'i', src: im ? (im.getAttribute('data-full') || im.getAttribute('src')) : '', alt: im ? im.alt : '' }; });
    patternSrc.remove();
    // Layout for THIS screen. Looping is only used on an axis where the pattern is longer than
    // the screen plus its largest tile, so the same image can never be on screen twice.
    // An axis that cannot loop holds still (no drift, clamped drag). Tiles never cross the pattern edge.
    const isMob = window.innerWidth <= 760;
    const GAP = isMob ? 16 : 40, EDGE = 14;
    const AR = sourceTiles.map(t => Math.min(2.4, Math.max(0.5, parseFloat(t.getAttribute('data-ar')) || 1.5)));
    let LX = false, LY = false, lastVW = 0, lastVH = 0;
    const split = (vals, k) => {
      const n = vals.length, S = vals.reduce((a, b) => a + b, 0), out = []; let cur = [], acc = 0;
      vals.forEach((v, i) => {
        cur.push(i); acc += v;
        const left = n - i - 1, need = k - out.length - 1;
        if (need > 0 && left >= need && (acc >= S * (out.length + 1) / k - v / 2 || left === need)) { out.push(cur); cur = []; }
      });
      if (cur.length) out.push(cur);
      return out.length === k ? out : null;
    };
    const solve = (vw, vh, relax) => {
      const n = AR.length, T = isMob ? 230 : 400;
      const hMin = vh * (relax ? 0.08 : (isMob ? 0.15 : 0.25)), hMax = vh * (relax ? 1.3 : (isMob ? 0.72 : 0.75)), wMax = vw * (relax ? 2.5 : (isMob ? 1.15 : 0.9));
      let best = null;
      const take = (c) => { if (!best || c.score < best.score) best = c; };
      const judge = (kind, groups, size, dims, PWc, PHc) => {
        let wm = 0, hm = 0, hn = 1e9, hs = 0;
        dims.forEach(d => { wm = Math.max(wm, d[0]); hm = Math.max(hm, d[1]); hn = Math.min(hn, d[1]); hs += d[1]; });
        if (hn < hMin || hm > hMax || wm > wMax) return;
        const lx = PWc >= vw + wm + GAP, ly = PHc >= vh + hm + GAP;
        if (!lx && PWc < vw + 2 * EDGE) return;
        if (!ly && PHc < vh + 2 * EDGE) return;
        const score = (lx && ly ? 0 : (lx || ly ? 1 : 3)) + Math.abs(Math.log(hs / dims.length / T));
        take({ score, kind, groups, size, PW: PWc, PH: PHc, lx, ly });
      };
      for (let r = 1; r <= n; r++) {
        const rows = split(AR, r); if (!rows) continue;
        const A = rows.map(g => g.reduce((s, i) => s + AR[i], 0));
        for (let W = vw; W <= vw * 12; W *= 1.025) {
          const hs = rows.map((g, k) => (W - GAP * g.length) / A[k]); if (Math.min(...hs) <= 0) continue;
          const dims = []; rows.forEach((g, k) => g.forEach(i => dims.push([AR[i] * hs[k], hs[k]])));
          judge('rows', rows, hs, dims, W, hs.reduce((s, h) => s + h + GAP, 0));
        }
      }
      for (let c = 1; c <= n; c++) {
        const cols = split(AR.map(a => 1 / a), c); if (!cols) continue;
        const B = cols.map(g => g.reduce((s, i) => s + 1 / AR[i], 0));
        for (let H = vh; H <= vh * 12; H *= 1.025) {
          const ws = cols.map((g, k) => (H - GAP * g.length) / B[k]); if (Math.min(...ws) <= 0) continue;
          const dims = []; cols.forEach((g, k) => g.forEach(i => dims.push([ws[k], ws[k] / AR[i]])));
          judge('cols', cols, ws, dims, ws.reduce((s, w) => s + w + GAP, 0), H);
        }
      }
      return best;
    };
    const build = () => {
      const vw = stage.clientWidth, vh = stage.clientHeight;
      lastVW = vw; lastVH = vh;
      const L = solve(vw, vh, false) || solve(vw, vh, true); if (!L) return;
      const pos = [];
      if (L.kind === 'rows') {
        let y = GAP / 2;
        L.groups.forEach((g, k) => { let x = GAP / 2; const h = L.size[k]; g.forEach(i => { const w = AR[i] * h; pos[i] = [x, y, w, h]; x += w + GAP; }); y += h + GAP; });
